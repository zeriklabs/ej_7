spring.application.name=ejercicio7
server.port=${PORT:8080}

# ===================================================================
# Configuración de Base de Datos H2 (En memoria por defecto, configurable por variables de entorno)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:entrenadoresdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Dialecto explícito para evitar error en contenedores Render: "Unable to determine Dialect without JDBC metadata"
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 web
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# Documentación OpenAPI / Swagger
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

